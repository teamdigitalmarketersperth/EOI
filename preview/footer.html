<!--
  GP Refresh footer: logo, contact details, social icons.
  Self-contained (scoped .gpr-footer CSS + inline SVG icons), so it renders the same everywhere and
  doesn't depend on icon fonts. To use on the live site, paste this whole block into an Elementor
  HTML widget in the footer template.
-->
<style>
  .gpr-footer {
    --gpr-ink: var(--theme-palette-color-1, #020a0a);
    --gpr-gold: var(--theme-palette-color-3, #be9a5e);
    --gpr-stone: var(--theme-palette-color-5, #ececea);
    background: var(--gpr-ink);
    color: #fff;
    font-family: "Urbanist", sans-serif;
    letter-spacing: 0.3px;
    padding: 88px 70px 64px;
  }

  .gpr-footer *,
  .gpr-footer *::before,
  .gpr-footer *::after {
    box-sizing: border-box;
  }

  .gpr-footer__inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 1300px;
    margin: 0 auto;
    text-align: center;
  }

  .gpr-footer__logo {
    display: inline-block;
    line-height: 0;
  }

  .gpr-footer__logo img {
    display: block;
    width: 260px;
    max-width: 100%;
    height: auto;
  }

  .gpr-footer__eyebrow {
    margin: 56px 0 28px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gpr-gold);
  }

  .gpr-footer__contact {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: 100%;
    max-width: 960px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .gpr-footer__contact li + li {
    border-left: 1px solid rgba(236, 236, 234, 0.16);
  }

  .gpr-footer__item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    padding: 4px 24px;
    color: #fff;
    text-decoration: none;
  }

  .gpr-footer__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    margin-bottom: 10px;
    border: 1px solid rgba(190, 154, 94, 0.5);
    border-radius: 50%;
    color: var(--gpr-gold);
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .gpr-footer__icon svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .gpr-footer__label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gpr-stone);
    opacity: 0.75;
  }

  .gpr-footer__value {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .gpr-footer__sub {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.7);
  }

  a.gpr-footer__item:hover .gpr-footer__value,
  a.gpr-footer__item:focus-visible .gpr-footer__value {
    color: var(--gpr-gold);
  }

  a.gpr-footer__item:hover .gpr-footer__icon,
  a.gpr-footer__item:focus-visible .gpr-footer__icon {
    background: var(--gpr-gold);
    border-color: var(--gpr-gold);
    color: var(--gpr-ink);
  }

  .gpr-footer__social {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 960px;
    margin: 56px 0 0;
    padding: 40px 0 0;
    border-top: 1px solid rgba(190, 154, 94, 0.5);
    list-style: none;
  }

  .gpr-footer__social a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(236, 236, 234, 0.25);
    border-radius: 50%;
    color: #fff;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .gpr-footer__social svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .gpr-footer__social a:hover,
  .gpr-footer__social a:focus-visible {
    background: var(--gpr-gold);
    border-color: var(--gpr-gold);
    color: var(--gpr-ink);
  }

  .gpr-footer a:focus-visible {
    outline: 2px solid var(--gpr-gold);
    outline-offset: 3px;
  }

  @media (max-width: 1024px) {
    .gpr-footer {
      padding: 72px 30px 56px;
    }

    .gpr-footer__item {
      padding: 4px 12px;
    }

    .gpr-footer__value {
      font-size: 16px;
    }
  }

  @media (max-width: 767px) {
    .gpr-footer {
      padding: 64px 20px 96px; /* bottom room for the back-to-top button */
    }

    .gpr-footer__logo img {
      width: 220px;
    }

    .gpr-footer__eyebrow {
      margin: 44px 0 8px;
      font-size: 12px;
      letter-spacing: 4px;
    }

    .gpr-footer__contact {
      grid-template-columns: minmax(0, 1fr);
      max-width: 340px;
    }

    .gpr-footer__contact li + li {
      border-left: 0;
      border-top: 1px solid rgba(236, 236, 234, 0.16);
    }

    .gpr-footer__item {
      padding: 24px 0;
    }

    .gpr-footer__social {
      max-width: 340px;
      margin-top: 16px;
      padding-top: 32px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .gpr-footer__icon,
    .gpr-footer__social a {
      transition: none;
    }
  }
</style>
